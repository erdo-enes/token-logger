[SERVICE]
    Flush        1
    Log_Level    info
    storage.path /tmp/flb-storage/

# Option A (default): JSON lines over UDP -> netcat input
# token-logger config: [fluentbit] format = "json", port = 24225
[INPUT]
    Name        netcat
    Listen      127.0.0.1 24225
    Mode        udp
    Parser      json
    Tag         token_logger.calls
    storage.type filesystem

# Option B: Fluentd Forward protocol (MessagePack) over UDP
# token-logger config: [fluentbit] format = "forward", port = 24224
# Fluent Bit forward input supports UDP; uncomment to use instead of netcat:
# [INPUT]
#     Name     forward
#     Listen   127.0.0.1 24224
#     storage.type filesystem

[OUTPUT]
    Name        stdout
    Match       token_logger.*
    storage.total_limit_size 100M

# Example destination instead of stdout:
# [OUTPUT]
#     Name        forward
#     Match       token_logger.*
#     Host        fluentd.example.com
#     Port        24224
#     storage.type filesystem
